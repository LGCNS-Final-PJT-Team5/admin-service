spring:
  application:
    name: admin-service

  cloud:
    config:
      enabled: false
    # Feign 설정 추가
    openfeign:
      client:
        config:
          reward-service:
            url: http://localhost:8083
            connect-timeout: 5000
            read-timeout: 5000

  # H2 인메모리 DB (테스트용)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false  # 로그 줄이기
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080

# 추가 Feign 설정 (선택사항)
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

springdoc:
  swagger-ui:
    groups-oder: DESC
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /api-docs
  show-actuator: true