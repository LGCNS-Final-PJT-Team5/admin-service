apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LGCNS-Final-PJT-Team5/admin-service.git
    targetRevision: main
    path: charts  # Helm chart 위치
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true