apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: admin-service
    version: {{ .Chart.AppVersion | default "1.0" }}
data:
  application.yml: |
    server:
      port: {{ .Values.config.server.port | default 8080 }}
    spring:
      application:
        name: {{ .Values.config.app.name | default "admin-service" }}

    {{- if .Values.config.swagger.enabled }}
    springdoc:
      swagger-ui:
        groups-order: DESC
        tags-sorter: alpha
        operations-sorter: method
      api-docs:
        path: /api-docs
      show-actuator: true
      default-consumes-media-type: application/json
      default-produces-media-type: application/json
      writer-with-default-pretty-printer: true
    {{- end }}