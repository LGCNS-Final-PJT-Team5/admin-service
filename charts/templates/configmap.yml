apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: admin-service
    version: {{ .Chart.AppVersion | default "1.0" }}
data:
  application.yml: |
    server:
      port: {{ .Values.config.server.port | default 8080 }}
    spring:
      application:
        name: {{ .Values.config.app.name | default "admin-service" }}

    {{- if .Values.config.swagger.enabled }}
    springdoc:
      swagger-ui:
        groups-order: DESC
        tags-sorter: alpha
        operations-sorter: method
      api-docs:
        path: /api-docs
      show-actuator: true
      default-consumes-media-type: application/json
      default-produces-media-type: application/json
      writer-with-default-pretty-printer: true
    {{- end }}

    service:
      analysis:
        url: {{ .Values.config.service.analysis.url | default "http://analysis-service.analysis-service.svc.cluster.local:80" }}
      dashboard:
        url: {{ .Values.config.service.dashboard.url | default "http://dashboard-service.dashboard-service.svc.cluster.local:80" }}
      reward:
        url: {{ .Values.config.service.reward.url | default "http://reward-service.reward-service.svc.cluster.local:80" }}
      user:
        url: {{ .Values.config.service.user.url | default "http://user-service.user-service.svc.cluster.local:80" }}

    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
        prometheus:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true