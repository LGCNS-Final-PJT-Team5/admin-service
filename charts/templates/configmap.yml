apiVersion: v1
kind: ConfigMap
metadata:
  name {{ include "admin-service.fullname" . }}-config
  labels:
    {{- include "admin-service.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: ${{ .Values.server.port }}
    spring:
      application:
        name: ${{ .Values.config.app.name }}

    {{- if .Values.config.swagger.enabled }}
    springdoc:
      swagger-ui:
        groups-oder: DESC
        tags-sorter: alpha
        operations-sorter: method
      api-docs:
        path: /api-docs
      show-actuator: true
      default-consumes-media-type: application/json
      default-produces-media-type: application/json
      writer-with-default-pretty-printer: true
    {{- end }}